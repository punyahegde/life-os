name: Life OS Notifications

on:
  schedule:
    # Monday-Friday
    - cron: '0 6 * * 1-5'
      timezone: 'Asia/Kolkata'
    - cron: '10 6 * * 1-5'
      timezone: 'Asia/Kolkata'
    - cron: '0 9 * * 1-5'
      timezone: 'Asia/Kolkata'
    - cron: '0 14 * * 1-5'
      timezone: 'Asia/Kolkata'
    - cron: '30 17 * * 1-5'
      timezone: 'Asia/Kolkata'
    - cron: '30 19 * * 1-5'
      timezone: 'Asia/Kolkata'
    - cron: '0 21 * * 1-5'
      timezone: 'Asia/Kolkata'
    - cron: '30 22 * * 1-5'
      timezone: 'Asia/Kolkata'

    # Saturday
    - cron: '30 6 * * 6'
      timezone: 'Asia/Kolkata'
    - cron: '40 6 * * 6'
      timezone: 'Asia/Kolkata'
    - cron: '0 9 * * 6'
      timezone: 'Asia/Kolkata'
    - cron: '30 11 * * 6'
      timezone: 'Asia/Kolkata'
    - cron: '0 14 * * 6'
      timezone: 'Asia/Kolkata'
    - cron: '0 18 * * 6'
      timezone: 'Asia/Kolkata'

    # Sunday
    - cron: '0 7 * * 0'
      timezone: 'Asia/Kolkata'
    - cron: '10 7 * * 0'
      timezone: 'Asia/Kolkata'
    - cron: '0 9 * * 0'
      timezone: 'Asia/Kolkata'
    - cron: '0 17 * * 0'
      timezone: 'Asia/Kolkata'
    - cron: '0 18 * * 0'
      timezone: 'Asia/Kolkata'
    - cron: '30 22 * * 0'
      timezone: 'Asia/Kolkata'

  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --no-audit --no-fund

      - name: Send due Life OS notification
        env:
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: BCYUBwie6x40avpHbvjNeSwI0iI5xg8cjiDfpJsD6TFwmga7VpQX7ZUgRO4Kue3mT91WQQxkWfJKo88eX9il8WA
        run: node scripts/send-notification.js
